[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finsense-backend"
version = "0.1.0"
description = "FinSense AI-powered GST invoice intelligence backend"
authors = [
    {name = "FinSense Team", email = "dev@finsense.example"}
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "pandas>=2.1.0",
    "openpyxl>=3.1.0",
    "rapidfuzz>=3.7.0",
    "python-dateutil>=2.8.0",
    "tzdata>=2024.1",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "pdfplumber>=0.10.0",
    "pypdfium2>=4.0.0",
    "APScheduler>=3.10.0",
    "cryptography>=41.0.0",
    "itsdangerous>=2.1.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-api-python-client>=2.100.0",
    "reportlab>=4.0.0"
]

[project.optional-dependencies]
ml = [
    "paddlepaddle>=3.0.0",
    "paddleocr>=2.7.0"
]

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "C90", "I"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v"]
